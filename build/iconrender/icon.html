<!doctype html><html><head><link rel="stylesheet" href="../../src/notch/notch.css">
<style>html,body{margin:0;background:transparent!important;overflow:hidden;width:1024px;height:1024px}
.tile{position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:185px;background:linear-gradient(160deg,#2a2840,#141322 70%);box-shadow:inset 0 2px 0 rgba(255,255,255,.08)}
.notch{position:absolute;left:50%;top:0;transform:translateX(-50%);width:300px;height:70px;background:#000;border-radius:0 0 40px 40px}
.glow{position:absolute;left:50%;top:58%;width:560px;height:560px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(120,240,200,.22),transparent)}
.m{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%)}
.m *{animation:none!important}
</style></head><body data-color="mint"><div class="tile"><div class="notch"></div><div class="glow"></div><div class="m" id="m"></div></div>
<script src="../../src/notch/nubbi.js"></script>
<script>document.getElementById('m').appendChild(Nubbi.create(560));</script></body></html>
